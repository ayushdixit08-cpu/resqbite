components:
  schemas:
    APIResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data: {}
        errors:
          nullable: true
      required:
      - message
      - success
    CategoryEnum:
      enum:
      - VEG
      - NON_VEG
      - VEGAN
      - DESSERTS
      - BAKERY
      - BEVERAGES
      - FRUITS
      - PACKED_FOOD
      type: string
      description: |-
        * `VEG` - Veg
        * `NON_VEG` - Non-Veg
        * `VEGAN` - Vegan
        * `DESSERTS` - Desserts
        * `BAKERY` - Bakery
        * `BEVERAGES` - Beverages
        * `FRUITS` - Fruits
        * `PACKED_FOOD` - Packed Food
    Donation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        donor:
          type: string
          format: uuid
          readOnly: true
        donor_name:
          type: string
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        food_name:
          type: string
          maxLength: 200
        category:
          $ref: '#/components/schemas/CategoryEnum'
        food_type:
          type: string
          maxLength: 100
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        quantity_unit:
          $ref: '#/components/schemas/QuantityUnitEnum'
        people_served:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        prepared_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        pickup_address:
          type: string
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        special_instructions:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/DonationStatusEnum'
          readOnly: true
        food_safety:
          $ref: '#/components/schemas/FoodSafetyChecklist'
        images:
          type: array
          items:
            type: string
            format: uri
          writeOnly: true
        image_details:
          type: array
          items:
            $ref: '#/components/schemas/DonationImage'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - created_at
      - donor
      - donor_name
      - expires_at
      - food_name
      - food_safety
      - food_type
      - id
      - image_details
      - organization
      - prepared_at
      - quantity
      - status
      - updated_at
    DonationImage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          readOnly: true
        alt_text:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - alt_text
      - created_at
      - id
      - url
    DonationRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        donation:
          type: string
          format: uuid
        organization:
          type: string
          format: uuid
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DonationRequestStatusEnum'
          readOnly: true
        message:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - donation
      - id
      - organization
      - organization_name
      - status
      - updated_at
    DonationRequestStatusEnum:
      enum:
      - PENDING
      - ACCEPTED
      - REJECTED
      type: string
      description: |-
        * `PENDING` - Pending
        * `ACCEPTED` - Accepted
        * `REJECTED` - Rejected
    DonationStatusEnum:
      enum:
      - PENDING
      - ACCEPTED
      - COMPLETED
      - CANCELLED
      type: string
      description: |-
        * `PENDING` - Pending
        * `ACCEPTED` - Accepted
        * `COMPLETED` - Completed
        * `CANCELLED` - Cancelled
    FoodSafetyChecklist:
      type: object
      properties:
        freshly_prepared:
          type: boolean
        properly_packed:
          type: boolean
        expiry_marked:
          type: boolean
        food_type_marked:
          type: boolean
        allergens:
          type: string
          maxLength: 500
      required:
      - expiry_marked
      - food_type_marked
      - freshly_prepared
      - properly_packed
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
        registration_document:
          type: string
          format: uri
          nullable: true
          writeOnly: true
        phone:
          type: string
          maxLength: 25
        website:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        address:
          type: string
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        food_preferences: {}
        capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        current_demand:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        verification_status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
        response_time_minutes:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        type:
          type: string
          readOnly: true
        verified:
          type: boolean
          readOnly: true
        bio:
          type: string
          readOnly: true
        location:
          type: string
          readOnly: true
      required:
      - bio
      - created_at
      - id
      - location
      - name
      - response_time_minutes
      - type
      - updated_at
      - user_id
      - verification_status
      - verified
    PaginatedDonationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Donation'
    PaginatedDonationRequestList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
