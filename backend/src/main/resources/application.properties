spring.application.name=resqbite-backend
server.port=5000

# PostgreSQL defaults for deployment. Local test profile uses H2.
spring.datasource.url=jdbc:postgresql://localhost:5432/resqbite
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=ResQBiteJWTSecretKey2026!VeryStrongForHMAC256Signature0001
jwt.expiration-ms=86400000

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
