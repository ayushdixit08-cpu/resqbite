spring.application.name=resqbite-backend
server.port=${PORT:${SERVER_PORT:5000}}

# PostgreSQL defaults for deployment. Local test profile uses H2.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resqbite}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:ResQBiteJWTSecretKey2026!VeryStrongForHMAC256Signature0001}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
